<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Polaris — safer night walks</title>
  <!-- Fetch data and open basemap connections before app.js runs. Keep URLs in sync with app.js. -->
  <link rel="preload" href="../data/lamps.geojson" as="fetch" crossorigin>
  <link rel="preload" href="../data/dead_lamps.json" as="fetch" crossorigin>
  <link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin>
  <link rel="preconnect" href="https://tiles.basemaps.cartocdn.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" role="application" aria-label="Map of San Francisco streetlights. Click to set a start point, then a destination."></div>

  <aside id="panel" aria-label="Plan a walk">
    <div class="section">
      <header class="brand">
        <svg class="logo" viewBox="0 0 28 28" aria-hidden="true">
          <defs><linearGradient id="lg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ff8fc3"/><stop offset=".5" stop-color="#ffa255"/><stop offset="1" stop-color="#8ccaff"/></linearGradient></defs>
          <path d="M4 22 L11 13 L17 16 L24 5" fill="none" stroke="url(#lg)" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="4" cy="22" r="2.2" fill="#ff8fc3"/><circle cx="11" cy="13" r="1.8" fill="#ffa255"/><circle cx="17" cy="16" r="1.8" fill="#7fe3bf"/>
          <path d="M24 0.5C24.5 4 25.5 5 28 5.2C25.5 5.5 24.5 6.5 24 10C23.5 6.5 22.5 5.5 20 5.2C22.5 5 23.5 4 24 0.5Z" fill="#fff8ee"/>
        </svg>
        <span class="wordmark">Polaris</span>
      </header>
    </div>

    <div class="section directions">
      <ol id="stops" class="stops" aria-label="Stops"></ol>
      <button id="swap" type="button" class="swap" title="Reverse start and destination" aria-label="Reverse start and destination">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M7 4v13M3.5 13.5 7 17l3.5-3.5M17 20V7m-3.5 3.5L17 7l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="stops-actions">
        <button id="add-stop" type="button" class="text-btn">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          Add stop
        </button>
        <button id="clear" type="button" class="link">Clear</button>
      </div>

      <details class="options">
        <summary>Options</summary>
        <div class="slider-row">
          <span>Fastest</span>
          <input type="range" id="alpha" min="0" max="100" value="20" aria-label="Weighting between speed and light">
          <span>Brightest</span>
        </div>
        <label class="check"><input type="checkbox" id="outages" checked> Avoid broken lights</label>
      </details>
    </div>

    <p id="status" class="section" aria-live="polite"></p>

    <div id="routes" hidden>
      <button type="button" class="route-card" data-route="lit" aria-pressed="true" style="--rc: var(--butter)">
        <span class="rc-top"><span class="rc-time" data-stat="minutes"></span><span class="rc-name">Brightest</span></span>
        <span class="rc-tag" data-stat="tag"></span>
        <span class="rc-via" data-stat="via"></span>
      </button>
      <button type="button" class="route-card" data-route="shortest" aria-pressed="false" style="--rc: var(--lilac)">
        <span class="rc-top"><span class="rc-time" data-stat="minutes"></span><span class="rc-name">Shortest</span></span>
        <span class="rc-tag" data-stat="tag"></span>
        <span class="rc-via" data-stat="via"></span>
      </button>
      <p id="note" class="route-note"></p>
    </div>
  </aside>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
